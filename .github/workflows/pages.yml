name: Web (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Depoda web/ klasörü yok; burada üretilir.
      - name: Web platform klasörünü üret
        run: |
          # Simge aracı pubspec'teki android/ios/web ayarlarının hepsini okur; üçünü de üret.
          flutter create --platforms=android,ios,web --org com.polat --project-name polat_rd .
          # flutter create kendi örnek dosyalarını yazmış olabilir; bizimkileri geri yükle.
          git checkout -- lib test pubspec.yaml assets

      - run: flutter pub get

      - name: Web simgelerini üret
        run: |
          set -o pipefail
          dart run flutter_launcher_icons 2>&1 | tee icons.log || {
            echo "::error title=flutter_launcher_icons::$(tail -n 40 icons.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }

      - name: Uygulama adı ve renkleri
        run: |
          sed -i 's/android:label="[^"]*"/android:label="POLAT R\&amp;D"/' android/app/src/main/AndroidManifest.xml
          sed -i 's|<title>[^<]*</title>|<title>POLAT R\&amp;D</title>|' web/index.html
          sed -i 's|name="apple-mobile-web-app-title" content="[^"]*"|name="apple-mobile-web-app-title" content="POLAT R\&amp;D"|' web/index.html
          sed -i 's|name="description" content="[^"]*"|name="description" content="POLAT R\&amp;D hesaplama araçları"|' web/index.html
          python3 - <<'EOF'
          import json
          p = 'web/manifest.json'
          m = json.load(open(p, encoding='utf-8'))
          m['name'] = 'POLAT R&D'
          m['short_name'] = 'POLAT R&D'
          m['description'] = 'POLAT R&D hesaplama araçları'
          m['background_color'] = '#FAB802'
          m['theme_color'] = '#1A1C2B'
          json.dump(m, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          EOF

      - name: Testler
        run: flutter test

      # Web uygulaması alt klasörde (/app/) durur; kök sayfa telefona göre yönlendiren paylaşım sayfasıdır.
      # Özel alan adına (ör. rd.polatas.com.tr) geçilirse BASE_HREF "/app/" olmalıdır.
      - name: Web derle
        env:
          BASE_HREF: /polat/app/
        run: flutter build web --release --base-href "$BASE_HREF"

      - name: Android APK derle
        run: flutter build apk --release

      - name: Siteyi birleştir
        run: |
          mkdir -p _site/app
          cp -R build/web/. _site/app/
          cp build/app/outputs/flutter-apk/app-release.apk _site/polat-rd.apk
          cp site/index.html _site/index.html
          cp assets/icon/icon.png _site/icon.png
          touch _site/.nojekyll
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
